name: CD Pipeline

on:
  push:
    branches: [ "main", "nightly-testing" ]

concurrency:
  group: cd-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  run-cd:
    uses: ./.github/workflows/build.yml

  merge-into-nightly-testing:
    if: github.ref == 'refs/heads/main'
    needs: run-cd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nightly-testing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: nightly-testing
          fetch-depth: 0
          token: ${{ secrets.PARSEIT_TOKEN }}

      - name: Merge main into nightly-testing
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git merge origin/main --no-commit --strategy-option ours --allow-unrelated-histories
          git restore --staged lean-toolchain lake-manifest.json
          git commit --allow-empty -m "chore: merge main into nightly-testing"
          git push origin nightly-testing
