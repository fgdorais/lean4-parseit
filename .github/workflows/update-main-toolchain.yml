name: Update Main Toolchain

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"

concurrency:
  group: update-main-toolchain
  cancel-in-progress: false

jobs:
  update-main-toolchain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PARSEIT_TOKEN }}

      - name: Gather revisions
        id: toolchain
        run: |
          CURRENT_TOOLCHAIN=$(git show origin/main:lean-toolchain | tr -d '\n')

          UNICODE_BASIC_REV=$(git ls-remote --exit-code \
            https://github.com/fgdorais/lean4-unicode-basic.git \
            refs/heads/main | cut -f1)
          REQUESTED_TOOLCHAIN=$(curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/fgdorais/lean4-unicode-basic/${UNICODE_BASIC_REV}/lean-toolchain" | tr -d '\n')
          if [[ "$REQUESTED_TOOLCHAIN" != leanprover/lean4:* ]]; then
            echo "::error::Unexpected UnicodeBasic toolchain: ${REQUESTED_TOOLCHAIN}"
            exit 1
          fi

          if [ "$CURRENT_TOOLCHAIN" = "$REQUESTED_TOOLCHAIN" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "requested_toolchain=$REQUESTED_TOOLCHAIN" >> "$GITHUB_OUTPUT"
          echo "toolchain_rev=${REQUESTED_TOOLCHAIN#leanprover/lean4:}" >> "$GITHUB_OUTPUT"
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Merge nightly-testing
        if: steps.toolchain.outputs.updated == 'true'
        env:
          REQUESTED_TOOLCHAIN: ${{ steps.toolchain.outputs.requested_toolchain }}
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git merge --no-edit origin/nightly-testing
          git restore --source=origin/main -- lakefile.toml
          echo "$REQUESTED_TOOLCHAIN" > lean-toolchain

      - name: Install Lean
        if: steps.toolchain.outputs.updated == 'true'
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          use-github-cache: false

      - name: Update manifest
        if: steps.toolchain.outputs.updated == 'true'
        run: lake update --keep-toolchain

      - name: Create pull request
        if: steps.toolchain.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PARSEIT_TOKEN }}
          commit-message: "chore: update toolchain to ${{ steps.toolchain.outputs.toolchain_rev }}"
          branch: update-main-toolchain-${{ steps.toolchain.outputs.toolchain_rev }}
          base: main
          delete-branch: true
          title: "chore: update toolchain to ${{ steps.toolchain.outputs.toolchain_rev }}"
