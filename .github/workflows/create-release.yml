name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # doc-gen4 only builds with its own toolchain, so pick a doc-gen4 revision that uses ours:
      # the release tag for our toolchain if there is one, otherwise main if it matches.
      - name: Find doc-gen4 revision
        id: docgen
        run: |
          TOOLCHAIN=$(tr -d '\n' < lean-toolchain)
          TOOLCHAIN_REV=${TOOLCHAIN#leanprover/lean4:}
          if git ls-remote --exit-code --tags https://github.com/leanprover/doc-gen4.git \
              "refs/tags/${TOOLCHAIN_REV}" > /dev/null; then
            echo "rev=${TOOLCHAIN_REV}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DOCGEN_REV=$(git ls-remote --exit-code \
            https://github.com/leanprover/doc-gen4.git refs/heads/main | cut -f1)
          DOCGEN_TOOLCHAIN=$(curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/leanprover/doc-gen4/${DOCGEN_REV}/lean-toolchain" \
            | tr -d '\n')
          if [ "$DOCGEN_TOOLCHAIN" = "$TOOLCHAIN" ]; then
            echo "rev=${DOCGEN_REV}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No doc-gen4 for ${TOOLCHAIN}; main uses ${DOCGEN_TOOLCHAIN}."
            exit 1
          fi

      - name: Install Lean
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          use-github-cache: true

      - name: Build Docs
        working-directory: docs
        env:
          DOCGEN_REV: ${{ steps.docgen.outputs.rev }}
        run: |
          sed -i "s/^rev = \"main\"$/rev = \"${DOCGEN_REV}\"/" lakefile.toml
          lake build ParseIt:docs

      - name: Compress Docs
        working-directory: docs
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          tar -czf docs-${TAG_NAME}.tar.gz doc doc-data
          zip -rq docs-${TAG_NAME}.zip doc doc-data

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            docs/docs-${{ github.ref_name }}.tar.gz
            docs/docs-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
